name: WordPress Plugin Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  # 1. KATMAN: WordPress Güvenlik ve Kod Standartları (PHPCS + WPCS)
  wp-security-standards:
    name: WPCS & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs

      - name: Install WordPress Coding Standards & Security Rules
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*"
          phpcs --config-set installed_paths ~/.composer/vendor/wp-coding-standards/wpcs,~/.composer/vendor/phpcompatibility/phpcompatibility-wp,~/.composer/vendor/phpcompatibility/php-compatibility

      - name: Run WP Security & Escaping Checks
        run: |
          phpcs --standard=WordPress \
            --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.Security.SafeRedirect,WordPress.DB.PreparedSQL \
            --extensions=php \
            --ignore=vendor/* .

  # 2. KATMAN: Derin PHP & WP Semantik Analiz (Semgrep)
  sast-semgrep:
    name: SAST (PHP & WordPress Rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep with PHP & WordPress Rulesets
        run: |
          semgrep scan --config p/php --config p/wordpress --error

  # 3. KATMAN: Koda Unutulmuş API Key / Token Taraması (Açık Kaynak Gitleaks CLI)
  secret-scan-gitleaks:
    name: Secret Scan (Gitleaks CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks CLI (License-Free)
        run: |
          GITLEAKS_VER="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose --redact