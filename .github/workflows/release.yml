name: Release

# Publishes a GitHub release with an installable plugin zip whenever a version tag (v4.3.0, v4.4.0, ...) is pushed.
#   git tag v4.3.0 && git push origin v4.3.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build zip and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER_VER="$(grep -m1 -E '^\s*\*\s*Version:' konser-takvimi.php | sed -E 's/.*Version:\s*//; s/\s+$//')"
          CONST_VER="$(grep -m1 "define( 'KT_PLUGIN_VER'" konser-takvimi.php | sed -E "s/.*'KT_PLUGIN_VER', '([^']+)'.*/\1/")"
          echo "tag=$TAG header=$HEADER_VER constant=$CONST_VER"
          if [ "$TAG" != "$HEADER_VER" ] || [ "$TAG" != "$CONST_VER" ]; then
            echo "::error::Tag v$TAG does not match the plugin header ($HEADER_VER) / KT_PLUGIN_VER ($CONST_VER)."
            exit 1
          fi
          grep -q "^## \[\?$TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $TAG."; exit 1; }

      - name: Run the test suite
        run: sh tests/run.sh

      - name: Build plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/konser-takvimi
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='tests' --exclude='build' \
            --exclude='README.tr.md' --exclude='.gitignore' --exclude='*.zip' \
            ./ build/konser-takvimi/
          (cd build && zip -r "../konser-takvimi-${VERSION}.zip" konser-takvimi)
          unzip -l "konser-takvimi-${VERSION}.zip" | tail -n 20

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $VERSION" > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "konser-takvimi-${VERSION}.zip" \
            --title "Konser Takvimi ${VERSION}" \
            --notes-file release-notes.md
