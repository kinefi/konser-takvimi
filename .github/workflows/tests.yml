name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} (lint + unit tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run PHP tests (WordPress functions are stubbed in tests/wp_stubs.php)
        run: |
          for f in tests/test_*.php; do
            echo "-- $f"
            php "$f"
          done

  js-tests:
    name: JavaScript (syntax + tracker tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check JS syntax
        run: |
          for f in assets/js/*.js tests/*.js; do
            node --check "$f"
          done

      - name: Run tracker tests
        run: node tests/tracker.test.js

  i18n:
    name: Translation template is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Regenerate the .pot and fail if it changed
        run: |
          php tools/extract-strings.php
          git diff --exit-code languages/konser-takvimi.pot || { echo "::error::Run 'php tools/extract-strings.php' and commit languages/konser-takvimi.pot"; exit 1; }

      - name: Rebuild the English catalogue and fail on missing translations
        run: |
          python3 tools/build-catalog.py
          git diff --exit-code languages/ || { echo "::error::Run 'python3 tools/build-catalog.py' and commit languages/"; exit 1; }
